<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>재료 편집기</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Malgun Gothic', sans-serif; background: #f5f5f5; color: #111; font-size: 18px; }

  .wrap { max-width: 560px; margin: 0 auto; background: #fff; min-height: 100vh; padding: 24px 28px 60px; }

  .top { display: flex; gap: 8px; margin-bottom: 18px; align-items: center; flex-wrap: wrap; }
  label.btn, button {
    padding: 8px 18px; background: #f0f0f0; border: 1px solid #ccc;
    color: #333; cursor: pointer; border-radius: 4px; font-size: 16px;
  }
  label.btn:hover, button:hover { background: #e4e4e4; }
  #fileInput { display: none; }
  #saveBtn { background: #e8f5e9; border-color: #66bb6a; color: #2e7d32; }
  #saveBtn:hover { background: #dcedc8; }
  #search {
    padding: 8px 10px; border: 1px solid #ccc; border-radius: 4px;
    font-size: 16px; width: 160px; outline: none; flex: 1; min-width: 100px;
  }
  #search:focus { border-color: #888; }

  table { width: 100%; border-collapse: collapse; }
  th {
    padding: 6px 0; font-size: 13px; color: #888;
    font-weight: normal; border-bottom: 2px solid #eee; text-align: left;
  }
  td { padding: 3px 0; border-bottom: 1px solid #f0f0f0; vertical-align: middle; }
  tr:hover td { background: #fafafa; }
  tr.hidden { display: none; }

  .tier { color: #aaa; font-size: 14px; white-space: nowrap; width: 46px; }
  .name { color: #222; white-space: nowrap; padding-left: 6px; font-size: 18px; }

  input.need {
    width: 110px; border: 1px solid #ddd; background: #fff;
    color: #111; padding: 4px 10px; text-align: right;
    font-size: 18px; border-radius: 3px; outline: none;
    display: block; margin-left: auto;
  }
  input.need:focus { border-color: #666; }
  input.need.zero { color: #bbb; }
  td.need-td { width: 110px; padding-left: 8px; }
</style>
</head>
<body>
<div class="wrap">

<div class="top">
  <label class="btn">불러오기<input type="file" id="fileInput" accept=".json"></label>
  <button id="saveBtn">저장</button>
  <input type="text" id="search" placeholder="재료명 검색">
</div>

<table>
  <thead>
    <tr>
      <th class="tier">등급</th>
      <th>재료</th>
      <th style="text-align:right;width:100px">need</th>
    </tr>
  </thead>
  <tbody id="tbody"></tbody>
</table>

<script>
let data = null;

document.getElementById('fileInput').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    data = JSON.parse(ev.target.result);
    render();
  };
  reader.readAsText(file);
  e.target.value = '';
});

function render() {
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';

  data.materials.forEach((m, i) => {
    const need = m.need ?? 0;
    const tr = document.createElement('tr');
    tr.dataset.name = m.item;
    tr.innerHTML =
      '<td class="tier">' + (m.tier || '') + '</td>' +
      '<td class="name">' + m.item + '</td>' +
      '<td class="need-td"><input class="need ' + (need === 0 ? 'zero' : '') +
        '" type="number" value="' + need + '" data-i="' + i + '"></td>';
    tbody.appendChild(tr);
  });

  tbody.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    const inputs = Array.from(document.querySelectorAll('#tbody tr:not(.hidden) input.need'));
    const idx = inputs.indexOf(e.target);
    if (idx >= 0 && idx < inputs.length - 1) {
      inputs[idx + 1].focus();
      inputs[idx + 1].select();
    }
  });

  tbody.addEventListener('input', e => {
    if (!e.target.classList.contains('need')) return;
    const val = parseFloat(e.target.value) || 0;   // 음수 그대로 허용
    data.materials[parseInt(e.target.dataset.i)].need = val;
    e.target.classList.toggle('zero', val === 0);
  });

  tbody.addEventListener('focus', e => {
    if (e.target.classList.contains('need')) e.target.select();
  }, true);
}

document.getElementById('search').addEventListener('input', e => {
  const q = e.target.value.trim();
  document.querySelectorAll('#tbody tr').forEach(tr => {
    tr.classList.toggle('hidden', q !== '' && !tr.dataset.name.includes(q));
  });
});

document.getElementById('saveBtn').addEventListener('click', () => {
  if (!data) return;
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'materials.json';
  a.click();
  URL.revokeObjectURL(a.href);
});
</script>
</div><!-- wrap -->
</body>
</html>
